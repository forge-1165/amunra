buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '0.5.0'
group = 'de.katzenpapst.amunra'
archivesBaseName = 'AmunRa-GC'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = '1.12.2-14.23.5.2860'
    runDir = 'run'
    mappings = 'stable_39'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    // Put the Galacticraft Legacy 4.0.5 release jar in ./libs (do not commit it).
    deobfCompile files('libs/Galacticraft-1.12.2-4.0.5.jar')
}

// The original 1.7.10 implementation is retained in the repository as migration
// reference, but it uses removed FML packages and cannot be compiled on 1.12.2.
// New 1.12.2 code lives in de.katzenpapst.amunra1122 until each feature is ported.
sourceSets {
    main {
        java {
            exclude 'de/katzenpapst/amunra/**'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version, mcversion: project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes 'Specification-Title': 'Amun-Ra',
                   'Specification-Vendor': 'Katzenpapst',
                   'Specification-Version': project.version,
                   'Implementation-Title': project.name,
                   'Implementation-Version': project.version
    }
}
